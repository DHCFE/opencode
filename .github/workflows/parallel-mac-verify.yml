name: Verify existing Parallel Mac package

on:
  push:
    branches: [parallel-mvp]
    paths:
      - "packages/app/e2e/mac-smoke.mjs"
      - ".github/workflows/parallel-mac-verify.yml"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.repository != 'anomalyco/opencode'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
      - uses: ./.github/actions/setup-bun
      - name: Download latest compiled package and verify its provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_RUN_ID=$(gh run list --workflow parallel-mac.yml --branch parallel-mvp --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$SOURCE_RUN_ID" && test "$SOURCE_RUN_ID" != null
          gh run watch "$SOURCE_RUN_ID" --exit-status || true
          gh run download "$SOURCE_RUN_ID" --name opencode-parallel-mac-arm64 --dir package
          EXPECTED_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)
          test "$(cat package/artifacts/source-commit.txt)" = "$EXPECTED_COMMIT"
          git rev-parse HEAD > package/artifacts/test-harness-commit.txt
          printf '%s\n' "$SOURCE_RUN_ID" > package/artifacts/source-run.txt
      - name: Mount and verify the compiled App
        run: |
          mkdir -p "$RUNNER_TEMP/parallel-mount"
          hdiutil attach package/packages/desktop/dist/*.dmg -readonly -nobrowse -mountpoint "$RUNNER_TEMP/parallel-mount"
          codesign --verify --deep --strict "$RUNNER_TEMP/parallel-mount/OpenCode Parallel.app"
          shasum -a 256 package/packages/desktop/dist/*.dmg > package/artifacts/SHA256SUMS
      - name: Launch and verify the packaged App
        timeout-minutes: 5
        working-directory: packages/app
        env:
          OPENCODE_MAC_EXECUTABLE: ${{ runner.temp }}/parallel-mount/OpenCode Parallel.app/Contents/MacOS/OpenCode Parallel
          OPENCODE_MAC_EVIDENCE: ${{ github.workspace }}/package/artifacts
        run: node e2e/mac-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: opencode-parallel-mac-verified-arm64
          path: package/
          if-no-files-found: error
          retention-days: 14
