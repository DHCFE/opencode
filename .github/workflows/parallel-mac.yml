name: Parallel Mac acceptance build

on:
  workflow_dispatch:
  push:
    branches: [parallel-mvp]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: parallel-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    if: github.repository != 'anomalyco/opencode'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      OPENCODE_CHANNEL: dev
      OPENCODE_PARALLEL_BUILD: "1"
      OPENCODE_CLI_TARGET: aarch64-apple-darwin
      OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: ./.github/actions/setup-bun
      - name: Record source
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          printf '%s\n' '09a1db3b088293d48d84d62e86c02b69b40ed3ee' > artifacts/upstream-commit.txt
      - name: Check source
        run: bun run check
      - name: Build modified backend and embedded UI
        working-directory: packages/cli
        run: bun run script/build.ts --single --skip-install
      - name: Verify native backend
        run: packages/cli/dist/cli-darwin-arm64/bin/opencode --version
      - name: Build desktop with modified backend
        working-directory: packages/desktop
        run: bun run build
      - name: Package Mac app
        working-directory: packages/desktop
        run: bunx electron-builder --mac --arm64 --config electron-builder.parallel.config.ts --publish never
      - name: Launch packaged Mac app
        timeout-minutes: 5
        working-directory: packages/app
        env:
          OPENCODE_MAC_EXECUTABLE: ${{ github.workspace }}/packages/desktop/dist/mac-arm64/OpenCode Parallel.app/Contents/MacOS/OpenCode Parallel
          OPENCODE_MAC_EVIDENCE: ${{ github.workspace }}/artifacts
        run: node e2e/mac-smoke.mjs
      - name: Verify bundle and record checksums
        run: |
          codesign --verify --deep --strict 'packages/desktop/dist/mac-arm64/OpenCode Parallel.app'
          shasum -a 256 packages/desktop/dist/*.dmg packages/desktop/dist/*.zip > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: opencode-parallel-mac-arm64
          path: |
            packages/desktop/dist/*.dmg
            artifacts/
          if-no-files-found: error
          retention-days: 14
